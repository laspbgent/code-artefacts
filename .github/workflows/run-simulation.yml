name: run-simulation

# Dispatched by the Rules Agent after it pushes a run to this repo.
#
# Deliberately player-free for now: this compiles the run's game against the core
# crate and runs the harness, which is everything needed to judge a generated game
# before any Player Agent exists. A later revision adds lobbies and turn events.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id, e.g. 20261104T1700Z-tictactoe"
        required: true
      core_ref:
        description: "ref of laspbgent/bgent-core to build against"
        required: false
        default: main
      seed:
        description: "harness seed"
        required: false
        default: "749079"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the run's artefacts
        uses: actions/checkout@v4

      - name: Fetch the core crate
        run: |
          git clone --depth 1 --branch "${{ inputs.core_ref }}" \
            https://github.com/laspbgent/bgent-core.git core

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Integrate and check
        env:
          RUN_ID: ${{ inputs.run_id }}
          SEED: ${{ inputs.seed }}
        run: |
          python3 core/scripts/integrate.py \
            --run-id "$RUN_ID" \
            --from-file "runs/$RUN_ID/game.rs" \
            --out-dir "$RUN_ID/out" \
            --seed "$SEED"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.run_id }}
          path: ${{ inputs.run_id }}/out/report.json
